<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brain Box</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <main class="app">
            <header class="top">
                <p class="logo">BRAIN BOX</p>
                <p class="score">Score: <span id="score">0</span></p>
            </header>

            <h1 class="question">Which Nigerian film became the country's highest-grossing release of all time?</h1>

            <div class="options">
                <button class="option" id="option-a">A. A Tribe Called Judah</button>
                <button class="option" id="option-b">B. The Wedding Party</button>
                <button class="option" id="option-c">C. Battle on Buka Street</button>
                <button class="option" id="option-d">D. King of Boys</button>
            </div>

            <p class="feedback" id="feedback"></p>
        </main>

        <script src="js/app.js"></script>
    </body>
</html>
